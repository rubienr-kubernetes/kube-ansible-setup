[defaults]
# Use the production inventory unless a command selects another inventory.
inventory = inventories/production/hosts.yml

# Resolve project roles from the repository-local roles directory.
roles_path = roles

# Discover the managed host's Python interpreter without warning noise.
interpreter_python = auto_silent

# Do not create legacy retry files after failed playbook runs.
retry_files_enabled = false

# Require SSH host identity verification by default.
host_key_checking = true

# Use Ansible's standard human-readable command output.
stdout_callback = default
